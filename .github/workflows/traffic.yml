name: Track Repository Traffic

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# 同一时刻只允许一个 traffic 任务运行，避免两次运行互相踩踏
concurrency:
  group: traffic-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_PAT }}
          ref: main
          # 保持浅克隆：本仓库历史含数百 MB 二进制，拉全量历史每天都是浪费
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # 抓取、汇总、提交、推送放在同一个循环里：
      # 每次重试都先把工作区对齐到最新 origin/main，再重新抓取并生成。
      # 脚本本身按日期去重（append_csv）且 summary 是整体重写（generate_summary），
      # 因此重复执行是幂等的，不需要 rebase，也不会有冲突。
      - name: Collect, commit and push
        shell: bash
        env:
          TRAFFIC_PAT: ${{ secrets.TRAFFIC_PAT }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "::group::第 ${attempt} 次尝试"

            # 对齐到最新远端，丢弃上一轮可能残留的本地提交。
            # 用 FETCH_HEAD 而非 origin/main：浅克隆下 origin/main 的跟踪引用
            # 不一定被更新，FETCH_HEAD 一定是本次 fetch 的结果。
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD

            python .github/scripts/fetch_traffic.py
            python .github/scripts/generate_summary.py

            git add traffic-data/
            if git diff --cached --quiet; then
              echo "traffic-data 无变化，无需提交。"
              echo "::endgroup::"
              exit 0
            fi

            git commit -m "chore: update traffic data [skip ci]"

            if git push origin HEAD:main; then
              echo "第 ${attempt} 次推送成功。"
              echo "::endgroup::"
              exit 0
            fi

            echo "第 ${attempt} 次推送被拒，5 秒后重新对齐并重试..."
            echo "::endgroup::"
            sleep 5
          done

          echo "::error::traffic-data 连续 5 次推送失败，请检查分支保护规则或 TRAFFIC_PAT 权限。"
          exit 1
