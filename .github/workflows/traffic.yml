name: Track Repository Traffic

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch traffic data
        env:
          TRAFFIC_PAT: ${{ secrets.TRAFFIC_PAT }}
        run: python .github/scripts/fetch_traffic.py

      - name: Generate summary
        run: python .github/scripts/generate_summary.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic-data/
          git diff --cached --quiet || git commit -m "chore: update traffic data [skip ci]"
          git push
